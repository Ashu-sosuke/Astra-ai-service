<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS Intelligence - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin/admin.css">
</head>

<body>
    <div class="dashboard-container">
        <header>
            <div class="header-content">
                <h1>SOS Intelligence</h1>
                <p>Command Center & Incident Response</p>
                <button id="processAllBtn" class="btn-primary" style="margin-top: 1rem;">Process Pending Incidents</button>
            </div>
            <div class="stats-overview">
                <div class="stat-card" id="totalIncidentsCard">
                    <h3>Total Incidents</h3>
                    <p id="totalIncidents">-</p>
                </div>
                <div class="stat-card emergency" id="emergencyCountCard">
                    <h3>Emergencies</h3>
                    <p id="emergencyCount">-</p>
                </div>
            </div>
        </header>

        <main>
            <div class="table-container">
                <table id="incidentsTable">
                    <thead>
                        <tr>
                            <th>Incident ID</th>
                            <th>Timestamp</th>
                            <th>Severity</th>
                            <th>Threat Type</th>
                            <th>Location (Lat/Lng)</th>
                            <th>Action</th>
                            <th>Transcript</th>
                            <th>View</th>
                        </tr>
                    </thead>
                    <tbody id="incidentsBody">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
                <div id="loader" class="loader">Loading...</div>
            </div>
        </main>
    </div>

    <!-- Modal for details -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modalTitle">Incident Details</h2>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <script src="/admin/admin.js"></script>
</body>

</html>
